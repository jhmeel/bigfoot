<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="overlay.css">
</head>
<body>
  <div id="select-layer"></div>
  <svg id="draw" width="100%" height="100%"></svg>
  <div id="labels"></div>
  <div id="stage">
    <div id="buddy" aria-hidden="true">
      <div id="buddy-fx">
        <svg id="paw" class="glyph" viewBox="15 15 70 70" width="22" height="22" aria-hidden="true">
          <defs>
            <linearGradient id="paw-fill" x1="0" y1="0.2" x2="0" y2="0.85">
              <stop offset="0" stop-color="#3a3e46"/>
              <stop offset="1" stop-color="#0d0e11"/>
            </linearGradient>
          </defs>
          <g fill="url(#paw-fill)" stroke="rgba(255,255,255,0.92)" stroke-width="3.2" stroke-linejoin="round" paint-order="stroke">
            <path d="M50,47 C66,47 80,60 76,72 C73,81 62,83 56,80 C53,78.5 51,77.5 50,77.5 C49,77.5 47,78.5 44,80 C38,83 27,81 24,72 C20,60 34,47 50,47 Z"/>
            <ellipse cx="24.5" cy="47.5" rx="6.8" ry="8.6" transform="rotate(-38 24.5 47.5)"/>
            <ellipse cx="33.5" cy="32.5" rx="7" ry="9.2" transform="rotate(-20 33.5 32.5)"/>
            <ellipse cx="50" cy="26.8" rx="7.2" ry="9.4"/>
            <ellipse cx="66.5" cy="32.5" rx="7" ry="9.2" transform="rotate(20 66.5 32.5)"/>
            <ellipse cx="75.5" cy="47.5" rx="6.8" ry="8.6" transform="rotate(38 75.5 47.5)"/>
          </g>
        </svg>
      <div id="wave" class="glyph">
        <i></i><i></i><i></i><i></i><i></i>
      </div>
      <div id="spinner" class="glyph"></div>
      </div>
    </div>
    <div id="bubble" class="bubble" aria-live="polite"></div>
  </div>

  <div id="ink-layer">
    <canvas id="ink-base"></canvas>
    <canvas id="ink-live"></canvas>
    <div id="ink-cursor"></div>
    <div class="ink-bar" id="ink-bar" role="toolbar" aria-label="Draw">
      <div class="ink-grip" id="ink-grip" title="Move toolbar"><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <button data-tool="pointer" title="Pointer: use your apps, keep drawings (V)"><svg viewBox="0 0 20 20"><path d="M5 3l10.5 6-4.6 1.2 2.7 4.8-2 1.1-2.7-4.8L5.6 14.5z"/></svg></button>
      <button data-tool="pen" title="Pen (P)"><svg viewBox="0 0 20 20"><path d="M12.8 3.6l3.6 3.6-8.6 8.6-4.3.7.7-4.3z"/><path d="M11 5.4l3.6 3.6"/></svg></button>
      <button data-tool="highlighter" title="Highlighter (H)"><svg viewBox="0 0 20 20"><path d="M12 3l5 5-6.5 6.5-5-5z"/><path d="M5.5 9.5L4 15h3l1.5-1.5M3 17h9"/></svg></button>
      <button data-tool="brush" title="Brush (B)"><svg viewBox="0 0 20 20"><path d="M16.5 3.5c-3 1.5-6.5 5-7.8 7.2l1.6 1.6c2.2-1.3 5.7-4.8 7.2-7.8z"/><path d="M7.5 12c-2 0-3.3 1.3-3.5 3.1-.1.8-.7 1.4-1.5 1.6 2.4 1 6.3.6 6.6-2.9z"/></svg></button>
      <button data-tool="eraser" title="Eraser (E)"><svg viewBox="0 0 20 20"><path d="M11.8 3.8l4.4 4.4-7.6 7.6H5.4l-2-2c-.6-.6-.6-1.5 0-2.1z"/><path d="M7.2 8.4l4.4 4.4M9 16h8"/></svg></button>
      <span class="ink-sep"></span>
      <button data-tool="line" title="Line (L)"><svg viewBox="0 0 20 20"><path d="M4 16L16 4"/></svg></button>
      <button data-tool="arrow" title="Arrow (A)"><svg viewBox="0 0 20 20"><path d="M4 16L15.5 4.5M9 4.5h6.5V11"/></svg></button>
      <button data-tool="rect" title="Rectangle (R)"><svg viewBox="0 0 20 20"><rect x="3.5" y="5" width="13" height="10" rx="1.5"/></svg></button>
      <button data-tool="ellipse" title="Ellipse (O)"><svg viewBox="0 0 20 20"><ellipse cx="10" cy="10" rx="7" ry="5.5"/></svg></button>
      <span class="ink-sep"></span>
      <div class="ink-colors" id="ink-colors"></div>
      <span class="ink-sep"></span>
      <div class="ink-sizes" id="ink-sizes"></div>
      <span class="ink-sep"></span>
      <button id="ink-talk" class="talk" title="Talk: ask about your drawing, e.g. “neaten my circle” (or hold Ctrl + Alt)"><svg viewBox="0 0 20 20"><rect x="7" y="2.5" width="6" height="10" rx="3"/><path d="M4.5 9.5a5.5 5.5 0 0 0 11 0M10 15v2.5"/></svg></button>
      <span class="ink-sep"></span>
      <button id="ink-undo" title="Undo (Ctrl+Z)"><svg viewBox="0 0 20 20"><path d="M7.5 5L4 8.5 7.5 12"/><path d="M4.5 8.5h7a4.5 4.5 0 0 1 0 9H9"/></svg></button>
      <button id="ink-redo" title="Redo (Ctrl+Y)"><svg viewBox="0 0 20 20"><path d="M12.5 5L16 8.5 12.5 12"/><path d="M15.5 8.5h-7a4.5 4.5 0 0 0 0 9H11"/></svg></button>
      <button id="ink-clear" title="Clear all (Delete)"><svg viewBox="0 0 20 20"><path d="M4 6h12M8 6V4h4v2M5.5 6l.7 10c.1.8.7 1.4 1.5 1.4h4.6c.8 0 1.4-.6 1.5-1.4l.7-10"/></svg></button>
      <button id="ink-close" class="close" title="Close (Esc)"><svg viewBox="0 0 20 20"><path d="M5.5 5.5l9 9M14.5 5.5l-9 9"/></svg></button>
    </div>
  </div>

  <div id="math-layer">
    <canvas id="math-ink"></canvas>
    <div id="math-answers"></div>
    <div class="ink-bar math-bar">
      <span class="math-title"><svg viewBox="0 0 20 20"><path d="M3.5 6h5M6 3.5v5M11.5 6h5M3.8 12.3l4.4 4.4M8.2 12.3l-4.4 4.4M11.5 13h5M11.5 16h5"/></svg>Write a sum, get the answer</span>
      <span class="ink-sep"></span>
      <button id="math-undo" title="Undo (Ctrl+Z)"><svg viewBox="0 0 20 20"><path d="M7.5 5L4 8.5 7.5 12"/><path d="M4.5 8.5h7a4.5 4.5 0 0 1 0 9H9"/></svg></button>
      <button id="math-clear" title="Clear all (Delete)"><svg viewBox="0 0 20 20"><path d="M4 6h12M8 6V4h4v2M5.5 6l.7 10c.1.8.7 1.4 1.5 1.4h4.6c.8 0 1.4-.6 1.5-1.4l.7-10"/></svg></button>
      <button id="math-done" class="close" title="Close (Esc)"><svg viewBox="0 0 20 20"><path d="M5.5 5.5l9 9M14.5 5.5l-9 9"/></svg></button>
    </div>
  </div>

  <div id="banner" role="alert">
    <div class="banner-icon"></div>
    <div class="banner-text">
      <div class="banner-title"></div>
      <div class="banner-message"><span class="typed"></span><span class="caret"></span></div>
    </div>
    <div class="banner-progress"></div>
  </div>

  <script src="overlay.js"></script>
  <script src="overlay-draw.js"></script>
  <script src="overlay-math.js"></script>
  <script src="overlay-ink.js"></script>
</body>
</html>
