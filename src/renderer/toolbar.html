<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="toolbar.css">
  <title>Tools</title>
</head>
<body>
  <div class="tip" id="tip"></div>
  <div class="tray" id="tray" role="toolbar" aria-label="Tools">
    <button data-tool="talk" data-label="Talk (stays on until you stop it)" aria-label="Talk" aria-pressed="false">
      <svg viewBox="0 0 20 20"><rect x="7" y="2.5" width="6" height="10" rx="3"/><path d="M4.5 9.5a5.5 5.5 0 0 0 11 0M10 15v2.5"/></svg>
    </button>
    <button data-tool="select" data-label="Ask about an area" aria-label="Ask about an area">
      <svg viewBox="0 0 20 20"><path d="M3 7V4.5C3 3.7 3.7 3 4.5 3H7M13 3h2.5c.8 0 1.5.7 1.5 1.5V7M17 13v2.5c0 .8-.7 1.5-1.5 1.5H13M7 17H4.5c-.8 0-1.5-.7-1.5-1.5V13"/><circle cx="10" cy="10" r="1.8" class="fill"/></svg>
    </button>
    <button data-tool="draw" data-label="Draw on screen" aria-label="Draw on screen">
      <svg viewBox="0 0 20 20"><path d="M12.8 3.6l3.6 3.6-8.6 8.6-4.3.7.7-4.3z"/><path d="M11 5.4l3.6 3.6"/></svg>
    </button>
    <button data-tool="math" data-label="Math" aria-label="Math">
      <svg viewBox="0 0 20 20"><path d="M3.5 6h5M6 3.5v5M11.5 6h5M3.8 12.3l4.4 4.4M8.2 12.3l-4.4 4.4M11.5 13h5M11.5 16h5"/></svg>
    </button>
    <button data-tool="type" data-label="Type a request" aria-label="Type a request">
      <svg viewBox="0 0 20 20"><rect x="2.5" y="5" width="15" height="10" rx="2"/><path d="M5.5 8.5h.01M8.5 8.5h.01M11.5 8.5h.01M14.5 8.5h.01M6.5 11.8h7"/></svg>
    </button>
    <span class="sep"></span>
    <button data-tool="clear" data-label="Clear the screen" aria-label="Clear the screen">
      <svg viewBox="0 0 20 20"><path d="M4 6h12M8 6V4h4v2M5.5 6l.7 10c.1.8.7 1.4 1.5 1.4h4.6c.8 0 1.4-.6 1.5-1.4l.7-10"/></svg>
    </button>
  </div>
  <script src="toolbar.js"></script>
</body>
</html>
